[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railvision-ai"
version = "0.1.0"
description = "RailVision AI — real-time railway hazard detection & collision-risk platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RailVision AI Contributors" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "aiofiles>=23.2",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
ai = [
    "ultralytics>=8.3",   # provides YOLO26 model family
    "torch>=2.2",
    "torchvision>=0.17",
    "onnxruntime>=1.18",
]
s3 = ["boto3>=1.34", "aioboto3>=13.0"]
mlops = ["mlflow>=2.13", "dvc>=3.51"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",   # in-memory DB fallback for tests/CI
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
